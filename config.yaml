data:
  minimal: False
  force: False
  bdb_folder: /Users/henrykraessig/code/bdb2024/data/
  data_folder: /Users/henrykraessig/code/route2vec/data/
  train: 0.85
  val: 0.15

train:
  epochs: 50
  batch_size: 256
  target_folder: /Users/henrykraessig/code/route2vec/experiments/
  lr_base: 0.001
  lr_final: 0.00005
  lr_warmup: 1000

  mask_regions: False
  mask_players: True
  grid_size: 10
  mask_ratio: 0.75
  num_frames: 2

model:
  encode_masks: True
  add_rope: True

  encoder: 
    model_dimension: 64
    hidden_dimension: 128
    heads: 2
    attn_drop: .3
    proj_drop: .3
    ffn_drop: .3
    depth: 4
    add_rpb: False
    norm_first: True
    add_cls_token: True
  decoder: 
    model_dimension: 64
    hidden_dimension: 128
    heads: 2
    attn_drop: .3
    proj_drop: .3
    ffn_drop: .3
    depth: 1
    add_rpb: False
    norm_first: True
    add_cls_token: False
