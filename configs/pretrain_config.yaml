data:
  bdb_year: 2025
  data_folder: datasets
  force: true
  minimal: false
  train: 0.85
  val: 0.15
model:
  decoder:
    add_cls_token: false
    attn_drop: 0.3
    depth: 1
    ffn_drop: 0.3
    heads: 2
    hidden_dimension: 128
    model_dimension: 32
    norm_first: true
    proj_drop: 0.3
  encode_masks: true
  encoder:
    add_cls_token: true
    attn_drop: 0.3
    depth: 4
    ffn_drop: 0.3
    heads: 2
    hidden_dimension: 128
    model_dimension: 32
    norm_first: true
    proj_drop: 0.3
train:
  batch_size: 256
  epochs: 15
  folder_name: small
  grid_size: 10
  lr_base: 0.001
  lr_final: 5.0e-05
  lr_warmup: 1000
  mask_players: true
  mask_ratio_base: 0.70
  mask_ratio_final: 0.80
  reference_frame: true
  target_folder: experiments
