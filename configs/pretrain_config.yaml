data:
  bdb_year: 2025
  data_folder: datasets
  force: false
  minimal: true
  train: 0.85
  val: 0.15
model:
  decoder:
    add_cls_token: false
    attn_drop: 0.3
    depth: 1
    ffn_drop: 0.3
    heads: 16
    hidden_dimension: 2048
    model_dimension: 512
    norm_first: true
    proj_drop: 0.3
  encode_masks: true
  encoder:
    add_cls_token: true
    attn_drop: 0.3
    depth: 4
    ffn_drop: 0.3
    heads: 16
    hidden_dimension: 2048
    model_dimension: 512
    norm_first: true
    proj_drop: 0.3
train:
  batch_size: 256
  epochs: 1
  folder_name: large
  grid_size: 10
  lr_base: 0.001
  lr_final: 5.0e-05
  lr_warmup: 1000
  mask_players: true
  mask_ratio: 0.75
  reference_frame: true
  target_folder: experiments
